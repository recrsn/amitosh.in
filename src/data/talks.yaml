    youtube: ""
    tags: ["Python", "Instrumentation", "Monitoring"]

  - title: "Testing Data Pipelines"
    event: "PyCon US 2024"
    date: "May 18, 2024"
    location: "Pittsburgh, USA"
    description: "Practical approaches for testing data pipelines with Airflow as the example framework. Covers unit tests, integration tests, end-to-end testing, data snapshot testing, and data quality validation methods for both online and offline scenarios. These strategies apply across different pipeline tools, not just Airflow."
    slides: "assets/talks/testing-data-pipelines.pdf"
    youtube: "https://www.youtube.com/watch?v=o-tJ7OK3sSY"
    tags: ["Python", "Testing", "Data Engineering", "Airflow"]

